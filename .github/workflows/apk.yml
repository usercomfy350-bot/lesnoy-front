name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q LesnoyFront-APK.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build
        working-directory: LesnoyFront-APK
        run: |
          npm install
          npx cap add android
          sed -i '0,/<activity /s//<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LesnoyFront-apk
          path: LesnoyFront-APK/android/app/build/outputs/apk/debug/app-debug.apk
